# Intelligent Inventory Dashboard — local container stack.
# Brings up SQL Server 2022 + the IID.Api service wired together.
#
# Usage:
#   cp .env.example .env        # one-time, then edit secrets if you want
#   docker compose up --build   # foreground
#   docker compose up -d --build # detached
#   docker compose down         # stop + remove containers
#   docker compose down -v      # also drop the persisted SQL data volume
#
# Notes:
#   - The api waits on db via depends_on: { db: { condition: service_started } }
#     but does NOT wait for the DB to be query-ready — apply migrations first.
#   - Connection string is interpolated from .env via ${MSSQL_SA_PASSWORD}.
#   - On Apple Silicon (arm64) the SQL image runs through qemu emulation; if you'd
#     rather use the native arm64 build, switch the image to
#     mcr.microsoft.com/azure-sql-edge:latest (then drop the -No flag in the healthcheck).

name: iid

services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: iid-mssql
    environment:
      # Required by Microsoft images on non-Windows hosts.
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD}
      MSSQL_PID: ${MSSQL_PID:-Developer}
    ports:
      # Stable internal port; the host port below is what clients bind to.
      - "1433:1433"
    volumes:
      - iid_mssql_data:/var/opt/mssql
    healthcheck:
      # sqlcmd with -No skips TLS server-name validation; sqlcmd lives under mssql-tools18.
      test:
        - CMD-SHELL
        - /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$$MSSQL_SA_PASSWORD" -No -Q 'SELECT 1' || exit 1
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  api:
    build:
      # Same directory as docker-compose.yml (= the repo root).
      # Lets the Dockerfile use paths like src/IID.Api/... directly.
      context: .
      dockerfile: src/IID.Api/Dockerfile
    container_name: iid-api
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      # SQL Server inside compose is reachable by service name "db".
      ConnectionStrings__IID: "Server=db,1433;Database=IID;User Id=sa;Password=${MSSQL_SA_PASSWORD};TrustServerCertificate=True;Encrypt=False;"
      Jwt__Key: ${JWT_KEY}
      Jwt__Issuer: ${JWT_ISSUER:-iid.local}
      Jwt__Audience: ${JWT_AUDIENCE:-iid.client}
      Jwt__ExpiryMinutes: ${JWT_EXPIRY_MINUTES:-60}
      Cors__AllowedOrigins__0: ${CORS_ALLOWED_ORIGIN:-http://localhost:5173}
      OpenObserve__Enabled: "true"
      OpenObserve__Endpoint: "http://openobserve:5080/api/default"
      OpenObserve__AuthToken: ${OPENOBSERVE_AUTH_TOKEN:-YWRtaW5AaWlkLmxvY2FsOlBAc3N3MHJkIU9wZW5PYnNlcnZl}
      OpenObserve__StreamName: ${OPENOBSERVE_STREAM_NAME:-iid-api}
      OpenObserve__ServiceName: ${OTEL_SERVICE_NAME:-IID.Api}
      OpenObserve__ServiceVersion: ${OTEL_SERVICE_VERSION:-1.0.0}
      OpenObserve__Environment: ${OTEL_ENVIRONMENT:-Production}
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
      openobserve:
        condition: service_started
    deploy:
      resources:
        reservations:
          cpus: '2'
          memory: 4096M
        limits:
          cpus: '2'
          memory: 4096M
    restart: unless-stopped

  openobserve:
    image: openobserve/openobserve:latest
    container_name: iid-openobserve
    environment:
      ZO_ROOT_USER_EMAIL: ${OPENOBSERVE_EMAIL:-admin@iid.local}
      ZO_ROOT_USER_PASSWORD: ${OPENOBSERVE_PASSWORD:-P@ssw0rd!OpenObserve}
      ZO_DATA_DIR: /data
    ports:
      - "5080:5080"
    volumes:
      - iid_openobserve_data:/data
    restart: unless-stopped

volumes:
  iid_mssql_data:
    name: iid_mssql_data
  iid_openobserve_data:
    name: iid_openobserve_data
